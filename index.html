<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex War Engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div><div id="kicker" class="kicker"></div><h1 id="scenarioTitle"></h1></div>
    <div class="headerTools"><label for="scenarioPicker">Scenario</label><select id="scenarioPicker"></select><label for="sidePicker">Play as</label><select id="sidePicker"></select><div id="scale" class="scale"></div></div>
  </header>
  <main>
    <section id="boardWrap">
      <div id="mapControls" aria-label="Map controls">
        <label for="zoomSlider">Zoom</label>
        <input id="zoomSlider" type="range" min="35" max="140" value="100" step="5">
        <output id="zoomValue" for="zoomSlider">100%</output>
        <button id="fitMap" type="button">Fit map</button>
      </div>
      <canvas id="game" aria-label="Hex battlefield"></canvas>
    </section>
    <aside>
      <div id="turnBox" class="turn"><strong id="turnTitle"></strong><small id="turnSub"></small></div>
      <button id="endTurn" class="primary">End turn</button>
      <section class="card"><h2>Selected unit</h2><div id="unitCard"></div></section>
      <section class="card"><h2>Mission</h2><div id="mission"></div></section>
      <section class="card"><h2>Combat log</h2><div id="log"></div></section>
      <section class="card"><h2>Map key</h2><div id="legend" class="legend"></div></section>
      <div class="help"><kbd>Click</kbd> a friendly unit, then highlighted hexes to spend movement points. Keep moving while points remain. Click a red target to fire during your faction's turn.</div>
    </aside>
</main>
<div id="storyIntro" class="storyIntro" role="dialog" aria-modal="true" aria-labelledby="storyIntroTitle" hidden>
  <div class="storyFrame">
    <div class="storyHeader"><span>STRATEGIC SITUATION</span><span id="storyStatus">TRANSMISSION</span></div>
    <h2 id="storyIntroTitle"></h2>
    <div id="storyText" class="storyText" aria-live="polite"></div>
    <button id="storyControl" type="button">Skip transmission</button>
  </div>
</div>
<div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" hidden>
  <div class="dialogPanel">
    <div id="dialogEyebrow" class="dialogEyebrow"></div>
    <h2 id="dialogTitle"></h2>
    <div id="dialogBody" class="dialogBody"></div>
    <div id="dialogActions" class="dialogActions"></div>
  </div>
</div>
  <script src="src/hex-war-engine.js" defer></script>
  <script src="scenarios/bite-the-dust.js" defer></script>
  <script src="src/main.js" defer></script>
</body>
</html>
