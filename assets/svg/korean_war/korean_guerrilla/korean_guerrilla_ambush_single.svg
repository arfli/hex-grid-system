<?xml version="1.0" encoding="UTF-8"?>
<!--
  Korean War Sprite - Korean Guerrilla (KPA-Aligned Partisan)
  Viewpoint: Top-Down Overhead (Base orientation facing North / Up)

  Palette (Korean Guerrilla - Standard Snow & Terrain Readable):
    khaki-base:   #8A8461 (Washed khaki partisan jacket)
    khaki-shade:  #5E5A40 (Dark khaki cloth fold shade)
    khaki-hi:     #A39D78 (Khaki shoulder highlight)
    civ-cloth:    #D9D4C0 (Off-white civilian hemp shirt/vest)
    civ-shade:    #B3AE98 (Shaded off-white cloth)
    brown-cloth:  #6B5238 (Earth-brown coat & straw cape)
    brown-shade:  #4D3A27 (Deep brown shade)
    cap-base:     #5A5445 (Soft grey-brown partisan field cap)
    cap-shade:    #3E3A2F (Cap rear shade)
    cap-hi:       #756E5C (Cap crown highlight)
    pouch-base:   #7A6B4E (Crossed canvas bandolier & pouches)
    wood-stock:   #5C3D24 (Rifle/SMG wooden stock)
    metal-base:   #1F2224 (Weapon barrel & receiver metal)
    metal-hi:     #3E4448 (Metallic edge highlight)
    skin-base:    #C79B72 (Hands skin tone hint)
    outline:      #151612 (Dark 1.7px figure outline)
    shadow:       #0E100C (Soft contact shadow, opacity 0.30)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Korean Guerrilla (KPA-Aligned Partisan) - Ambush Pose (Single Soldier)</title>
  <desc>Original top-down tactical wargame SVG sprite of a single Korean Guerrilla (KPA-Aligned Partisan) infantryman in ambush pose, facing north.</desc>
  <style>
    :root {
      --khaki-base: #8A8461;
      --khaki-shade: #5E5A40;
      --khaki-hi: #A39D78;
      --civ-cloth: #D9D4C0;
      --civ-shade: #B3AE98;
      --brown-cloth: #6B5238;
      --brown-shade: #4D3A27;
      --brown-hi: #87694B;
      --cap-base: #5A5445;
      --cap-shade: #3E3A2F;
      --cap-hi: #756E5C;
      --pouch-base: #7A6B4E;
      --wood-stock: #5C3D24;
      --metal-base: #1F2224;
      --metal-hi: #3E4448;
      --skin-base: #C79B72;
      --foliage-1: #4E6334;
      --foliage-2: #6E7D44;
      --outline: #151612;
      --shadow: #0E100C;
    }
    .o {
      stroke: var(--outline);
      stroke-width: 0.85;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .ot {
      stroke: var(--outline);
      stroke-width: 0.65;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
  </style>
  <defs>
    <g id="shadow">
      <ellipse cx="1.8" cy="2.6" rx="11.8" ry="7.4" fill="var(--shadow)" fill-opacity="0.28"/>
    </g>

    <!-- Muzzle flash star polygon -->
    <g id="muzzle-flash">
      <polygon points="0,-7.5 1.6,-2.4 5.8,-4.2 2.4,-0.4 6.2,2.2 1.5,1.8 0,6.2 -1.5,1.8 -6.2,2.2 -2.4,-0.4 -5.8,-4.2 -1.6,-2.4" fill="#F28C28" class="ot"/>
      <polygon points="0,-4.8 1.0,-1.4 3.6,-2.4 1.4,0.0 3.4,1.4 0.8,1.0 0,3.6 -0.8,1.0 -3.4,1.4 -1.4,0.0 -3.6,-2.4 -1.0,-1.4" fill="#FFF3A1"/>
    </g>

    <!-- Dropped bolt-action rifle / SMG for fallen pose -->
    <g id="dropped-weapon">
      <ellipse cx="0.8" cy="1.2" rx="2.4" ry="9.5" fill="var(--shadow)" fill-opacity="0.26"/>
      <rect x="-1.1" y="-3.5" width="2.2" height="11.0" rx="0.8" fill="var(--wood-stock)" class="o"/>
      <rect x="-0.7" y="-10.5" width="1.4" height="8.5" rx="0.5" fill="var(--metal-base)" class="ot"/>
      <rect x="-0.9" y="-4.5" width="1.8" height="3.8" rx="0.4" fill="var(--metal-base)" class="ot"/>
      <path d="M0.9,-3.2 L2.6,-3.2" stroke="var(--metal-hi)" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <!-- Camouflage brush / grass tuft cluster -->
    <g id="camo-tuft">
      <path d="M-4.5,1.0 L-6.8,-2.8 L-2.8,-0.5 L-1.2,-4.2 L1.0,-0.8 L4.2,-3.6 L3.2,0.6 Z" fill="var(--foliage-1)" class="ot"/>
      <path d="M-2.5,1.4 L-3.8,-1.6 L0.0,-2.8 L2.6,-1.2 L1.8,1.4 Z" fill="var(--foliage-2)"/>
    </g>

    <!-- 1. Ambush Prone Rifleman behind low earth/brush mound with camo tufts -->
    <g id="soldier-base">
      <use href="#shadow"/>
      <!-- Low earth/stone cover mound in front of soldier -->
      <path d="M-11.5,-5.2 C-8.5,-9.2 8.5,-9.2 11.5,-5.2 C8.5,-3.6 -8.5,-3.6 -11.5,-5.2 Z" fill="var(--brown-shade)" class="o"/>
      <use href="#camo-tuft" transform="translate(-5.5, -6.2) scale(0.85)"/>
      <use href="#camo-tuft" transform="translate(5.8, -6.0) scale(0.85) rotate(12)"/>
      <!-- Tucked prone legs/boots behind torso -->
      <rect x="-7.2" y="5.2" width="4.2" height="5.5" rx="1.8" transform="rotate(14 -5.1 8.0)" fill="var(--brown-cloth)" class="o"/>
      <rect x="3.2" y="5.0" width="4.2" height="5.5" rx="1.8" transform="rotate(-16 5.3 7.8)" fill="var(--brown-cloth)" class="o"/>
      <!-- Flattened low-silhouette prone torso -->
      <path d="M-11.4,0.8 C-11.4,-2.6 -7.2,-4.2 0.0,-4.2 C7.2,-4.2 11.4,-2.6 11.4,0.8 C11.4,4.0 7.6,5.8 0.0,5.8 C-7.6,5.8 -11.4,4.0 -11.4,0.8 Z" fill="var(--khaki-base)" class="o"/>
      <path d="M-9.6,1.8 C-8.0,4.2 -4.2,5.0 0.0,5.0 C4.2,5.0 8.0,4.2 9.6,1.8 Z" fill="var(--khaki-shade)"/>
      <!-- Prone elbows braced wide -->
      <path d="M-11.2,0.4 C-12.2,-3.2 -8.8,-6.8 -2.4,-8.6 L-0.4,-6.2 C-5.0,-4.4 -6.8,-1.8 -6.8,1.0 Z" fill="var(--khaki-base)" class="o"/>
      <path d="M11.2,0.6 C12.0,-2.6 8.8,-5.8 3.0,-6.8 L1.4,-4.0 C5.4,-3.0 6.8,-1.0 6.8,1.4 Z" fill="var(--khaki-base)" class="o"/>
      <ellipse cx="-1.2" cy="-7.8" rx="1.8" ry="1.4" fill="var(--skin-base)" class="ot"/>
      <ellipse cx="2.0" cy="-5.2" rx="1.8" ry="1.4" fill="var(--skin-base)" class="ot"/>
      <!-- Rifle aimed dead ahead resting over cover mound -->
      <g transform="rotate(-2 0 -8)">
        <rect x="-1.0" y="-6.2" width="2.2" height="6.8" rx="0.7" fill="var(--wood-stock)" class="o"/>
        <rect x="-0.6" y="-17.2" width="1.4" height="11.5" rx="0.5" fill="var(--metal-base)" class="ot"/>
      </g>
      <!-- Camo foliage tufts on back -->
      <use href="#camo-tuft" transform="translate(-4.2, 3.6) rotate(-18) scale(0.9)"/>
      <use href="#camo-tuft" transform="translate(4.4, 3.8) rotate(22) scale(0.9)"/>
      
      <!-- Soft peaked partisan field cap -->
      <path d="M-4.6,-2.2 C-4.6,-5.8 4.6,-5.8 4.6,-2.2 Z" fill="var(--cap-shade)" class="ot"/>
      <path d="M-5.6,1.2 C-5.6,-2.2 -3.4,-4.2 0.0,-4.2 C3.4,-4.2 5.6,-2.2 5.6,1.2 C5.6,4.2 3.4,5.8 0.0,5.8 C-3.4,5.8 -5.6,4.2 -5.6,1.2 Z" fill="var(--cap-base)" class="o"/>
      <path d="M-4.6,2.0 C-3.8,4.0 -2.0,5.0 0.0,5.0 C2.0,5.0 3.8,4.0 4.6,2.0 C3.2,3.2 1.6,3.6 0.0,3.6 C-1.6,3.6 -3.2,3.2 -4.6,2.0 Z" fill="var(--cap-shade)"/>
      <ellipse cx="-0.4" cy="-0.8" rx="3.0" ry="2.0" fill="var(--cap-hi)"/>
      <!-- Camo foliage tuft on cap/head -->
      <use href="#camo-tuft" transform="translate(0.0, 0.2) scale(0.8)"/>
    </g>

    <!-- 2. Ambush SMG Gunner (Low crouch behind brush with drum SMG aimed forward) -->
    <g id="soldier-smg">
      <use href="#shadow"/>
      <path d="M-10.8,-5.0 C-7.8,-8.8 7.8,-8.8 10.8,-5.0 Z" fill="var(--brown-shade)" class="o"/>
      <use href="#camo-tuft" transform="translate(0, -6.2) scale(0.9)"/>
      <rect x="-6.6" y="4.8" width="4.0" height="5.0" rx="1.6" transform="rotate(10 -4.6 7.3)" fill="var(--brown-cloth)" class="o"/>
      <rect x="2.8" y="4.8" width="4.0" height="5.0" rx="1.6" transform="rotate(-12 4.8 7.3)" fill="var(--brown-cloth)" class="o"/>
      <path d="M-11.0,0.8 C-11.0,-2.6 -7.0,-4.2 0.0,-4.2 C7.0,-4.2 11.0,-2.6 11.0,0.8 C11.0,4.0 7.2,5.6 0.0,5.6 C-7.2,5.6 -11.0,4.0 -11.0,0.8 Z" fill="var(--civ-cloth)" class="o"/>
      <path d="M-10.8,0.4 C-11.6,-3.0 -8.4,-6.4 -2.2,-8.2 L-0.4,-5.8 C-4.8,-4.0 -6.4,-1.6 -6.4,1.0 Z" fill="var(--civ-cloth)" class="o"/>
      <path d="M10.8,0.6 C11.6,-2.4 8.4,-5.4 2.8,-6.4 L1.4,-3.8 C5.0,-2.8 6.4,-0.8 6.4,1.4 Z" fill="var(--civ-cloth)" class="o"/>
      <ellipse cx="-1.2" cy="-7.4" rx="1.8" ry="1.4" fill="var(--skin-base)" class="ot"/>
      <ellipse cx="1.8" cy="-4.8" rx="1.8" ry="1.4" fill="var(--skin-base)" class="ot"/>
      <g transform="rotate(3 0 -7)">
        <rect x="-1.1" y="-5.5" width="2.2" height="5.8" rx="0.8" fill="var(--wood-stock)" class="o"/>
        <circle cx="-2.0" cy="-6.8" r="2.4" fill="var(--metal-base)" class="o"/>
        <rect x="-0.8" y="-14.2" width="1.6" height="8.8" rx="0.5" fill="var(--metal-base)" class="o"/>
      </g>
      <use href="#camo-tuft" transform="translate(0, 3.8) scale(0.95)"/>
      
      <!-- Partisan knotted off-white head-cloth -->
      <ellipse cx="0.0" cy="1.0" rx="5.5" ry="5.0" fill="var(--civ-cloth)" class="o"/>
      <path d="M-4.8,1.8 C-3.6,4.2 3.6,4.2 4.8,1.8 C3.2,3.0 -3.2,3.0 -4.8,1.8 Z" fill="var(--civ-shade)"/>
      <path d="M-5.3,-0.2 C-2.0,-1.4 2.0,-1.4 5.3,-0.2" fill="none" stroke="var(--brown-shade)" stroke-width="1.2"/>
      <!-- Rear knot tails -->
      <path d="M1.2,5.5 L3.6,8.2 M0.2,5.6 L1.4,8.6" stroke="var(--civ-cloth)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0.8" cy="5.4" r="1.5" fill="var(--civ-shade)" class="ot"/>
      <use href="#camo-tuft" transform="translate(0.4, 0.0) rotate(8) scale(0.78)"/>
    </g>

    <!-- 3. Ambush LMG Gunner (Bipod deployed on mound, pan-fed LMG) -->
    <g id="soldier-lmg">
      <ellipse cx="2.0" cy="2.8" rx="12.6" ry="7.8" fill="var(--shadow)" fill-opacity="0.30"/>
      <path d="M-12.5,-5.4 C-9.0,-9.6 9.0,-9.6 12.5,-5.4 Z" fill="var(--brown-shade)" class="o"/>
      <use href="#camo-tuft" transform="translate(-6.2, -6.4) scale(0.9)"/>
      <use href="#camo-tuft" transform="translate(6.2, -6.4) scale(0.9)"/>
      <path d="M-12.0,1.0 C-12.0,-2.6 -7.6,-4.4 0.0,-4.4 C7.6,-4.4 12.0,-2.6 12.0,1.0 C12.0,4.4 8.0,6.2 0.0,6.2 C-8.0,6.2 -12.0,4.4 -12.0,1.0 Z" fill="var(--brown-cloth)" class="o"/>
      <path d="M-11.6,0.4 C-12.4,-3.2 -9.0,-6.8 -2.6,-8.8 L-0.4,-6.2 C-5.2,-4.4 -7.2,-1.8 -7.2,1.0 Z" fill="var(--brown-cloth)" class="o"/>
      <path d="M11.6,0.6 C12.4,-2.6 9.0,-5.8 3.2,-6.8 L1.6,-4.0 C5.8,-3.0 7.2,-1.0 7.2,1.4 Z" fill="var(--brown-cloth)" class="o"/>
      <!-- LMG on bipod -->
      <path d="M-0.4,-14.5 L-4.2,-11.6 M0.8,-14.5 L4.6,-11.6" stroke="var(--metal-base)" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="-1.1" y="-6.0" width="2.4" height="6.5" rx="0.8" fill="var(--wood-stock)" class="o"/>
      <rect x="-0.9" y="-17.5" width="2.0" height="11.8" rx="0.6" fill="var(--metal-base)" class="o"/>
      <circle cx="0.1" cy="-9.2" r="3.2" fill="var(--metal-base)" class="o"/>
      <use href="#camo-tuft" transform="translate(-4.6, 3.8) scale(0.9)"/>
      <use href="#camo-tuft" transform="translate(4.6, 3.8) scale(0.9)"/>
      
      <!-- Soft peaked partisan field cap -->
      <path d="M-4.6,-2.2 C-4.6,-5.8 4.6,-5.8 4.6,-2.2 Z" fill="var(--cap-shade)" class="ot"/>
      <path d="M-5.6,1.2 C-5.6,-2.2 -3.4,-4.2 0.0,-4.2 C3.4,-4.2 5.6,-2.2 5.6,1.2 C5.6,4.2 3.4,5.8 0.0,5.8 C-3.4,5.8 -5.6,4.2 -5.6,1.2 Z" fill="var(--cap-base)" class="o"/>
      <path d="M-4.6,2.0 C-3.8,4.0 -2.0,5.0 0.0,5.0 C2.0,5.0 3.8,4.0 4.6,2.0 C3.2,3.2 1.6,3.6 0.0,3.6 C-1.6,3.6 -3.2,3.2 -4.6,2.0 Z" fill="var(--cap-shade)"/>
      <ellipse cx="-0.4" cy="-0.8" rx="3.0" ry="2.0" fill="var(--cap-hi)"/>
      <use href="#camo-tuft" transform="translate(0, 0.2) scale(0.82)"/>
    </g>
  </defs>
  <g id="squad" transform="translate(32, 37) scale(1.95)">
    <use href="#soldier-base"/>
  </g>
</svg>
